      function loadThirdParty() {
        if (window.__thirdPartyLoaded) return;
        window.__thirdPartyLoaded = true;
        // GTM
        var g = document.createElement('script');
        g.async = true;
        g.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-P72X9ZR4';

        cs.async = true;
        cs.src = 'https://t.contentsquare.net/uxa/fc16179df91a5.js';

      // Load on the first real user interaction...
      var events = ['scroll', 'mousemove', 'touchstart', 'keydown', 'click'];
      function trigger() {
        events.forEach(function (e) { window.removeEventListener(e, trigger); });
        loadThirdParty();
      }
      events.forEach(function (e) { window.addEventListener(e, trigger, { passive: true, once: true }); });

      // ...otherwise ~3.5s after load. requestIdleCallback's `timeout` is an
      // upper bound, not a delay: on its own it grants no minimum wait at all
      // and can run as soon as the first idle gap appears, which on a fast
      // hydrating page is still inside the LCP window. Burn a real timer to get
      // a guaranteed floor, then let rIC pick a quiet moment within it.
      function whenIdle() {
        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadThirdParty, { timeout: 2000 });
        } else {
          loadThirdParty();
        }
      }
      function startTimer() { setTimeout(whenIdle, 3500); }
      if (document.readyState === 'complete') {
        startTimer();
      } else {
        window.addEventListener('load', startTimer, { once: true });
      }
